services:
  - type: web
    name: sidequest-irl
    runtime: node
    buildCommand: npm install --omit=dev
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB
        value: sidequest
      - key: AUTH_SECRET
        generateValue: true
      - key: GOOGLE_GENERATIVE_AI_KEY
        sync: false
      - key: GOOGLE_GENERATIVE_AI_MODEL
        value: gemini-3.8-flash
