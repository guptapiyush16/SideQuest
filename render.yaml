services:
  - type: web
    name: wilddex
    runtime: node
    buildCommand: npm install --omit=dev
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB
        value: wilddex
      - key: AUTH_SECRET
        generateValue: true
      - key: OPEN_ROUTER_APIKEY
        sync: false
      - key: OPENROUTER_MODEL
        value: google/gemini-2.5-flash
      - key: GEMINI_API_KEY
        sync: false
