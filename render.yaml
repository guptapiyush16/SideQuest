services:
  - type: web
    name: sidequest-irl
    runtime: node
    buildCommand: npm install --omit=dev
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB
        value: sidequest
      - key: AUTH_SECRET
        generateValue: true
      - key: OPEN_ROUTER_APIKEY
        sync: false
      - key: OPENROUTER_MODEL
        value: google/gemma-4-26b-a4b-it:free
